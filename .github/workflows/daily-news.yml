name: Daily News Digest

on:
  schedule:
    # Runs at 2:30 AM UTC = 8:00 AM IST every day.
    # Change this if you want a different time (cron is always in UTC).
    - cron: "30 2 * * *"
  workflow_dispatch: {}   # lets you manually trigger a test run from GitHub UI

jobs:
  send-news:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"

      - name: Install dependencies
        run: pip install -r requirements.txt

      - name: Run news bot
        env:
          TELEGRAM_BOT_TOKEN: ${{ secrets.TELEGRAM_BOT_TOKEN }}
          NEWS_API_KEY: ${{ secrets.NEWS_API_KEY }}
          GOOGLE_CREDENTIALS_JSON: ${{ secrets.GOOGLE_CREDENTIALS_JSON }}
          SHEET_NAME: "news bot subscribers spreadsheet"
        run: python daily_news_bot.py